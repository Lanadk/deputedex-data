name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  test-integration:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deputydex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/deputydex_test?schema=public
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: deputydex_test
      DB_USER_WRITER: postgres
      DB_PASSWORD_WRITER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  build:
    needs: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  sync-schema:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            schema:
              - 'prisma/schema.prisma'
      - name: Checkout deputydex
        if: steps.filter.outputs.schema == 'true'
        uses: actions/checkout@v4
        with:
          repository: lanadk/deputydex
          ref: main
          token: ${{ secrets.DEPUTYDEX_PUSH_TOKEN }}
          path: deputydex
      - name: Sync schema.prisma into deputydex
        if: steps.filter.outputs.schema == 'true'
        run: |
          mkdir -p deputydex/app/infrastructure/db/prisma
          cp prisma/schema.prisma deputydex/app/infrastructure/db/prisma/schema.prisma
          cd deputydex
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/infrastructure/db/prisma/schema.prisma
          if git diff --staged --quiet; then
            echo "schema.prisma already in sync, nothing to commit"
          else
            git commit -m "chore: sync schema.prisma from deputydex-data@${{ github.sha }}"
            git push
          fi

  trigger-deploy:
    needs: sync-schema
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CD_DISPATCH_TOKEN }}
          repository: lanadk/deputydex-cd
          event-type: deploy-etl
